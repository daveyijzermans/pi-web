root = "."
tmp_dir = "tmp"

[build]
  include_ext = ["go", "css", "html", "tpl", "tmpl"]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/pi-web"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "node_modules", "web/node_modules", "e2e/node_modules", "website/node_modules", "web/src", ".git"]
  exclude_regex = ["_test.go"]
  include_file = ["web/dist/.vite/manifest.json", "internal/ui/embedded/export/export.js"]
  send_interrupt = true
  kill_delay = "1s"
  args_bin = ["--host", "0.0.0.0", "-p", "31415"]
